jobs:
  install:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts  # Ensure artifacts are placed in this directory

      - name: Verify Downloaded Artifacts
        run: |
          ls -R
          if [ ! -d build-artifacts ]; then echo "❌ build-artifacts directory is missing!" && exit 1; fi
          if [ -z "$(ls -A build-artifacts/*.whl 2>/dev/null)" ]; then echo "❌ No .whl file found!" && exit 1; fi

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          environment-file: env.yml
          activate-environment: ml_project_env
          use-mamba: true

      - name: Install Package
        run: pip install build-artifacts/*.whl  # Corrected path

      - name: Run Data Ingestion Script
        run: python scripts/ingest_data.py --output-path data/processed_data.csv

      - name: Run Model Training Script
        run: python scripts/train.py --input-path data/processed_data.csv --output-path model_registry/trained_model.pkl --log-level DEBUG --log-path logs/train.log --no-console-log

      - name: Run Scoring Script
        run: python scripts/score.py --model-path model_registry/trained_model.pkl --data-path data/processed_data.csv
